name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Quantitative, offline-report and Streamlit regression tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q streamlit_app.py src
      - name: Import application modules
        run: |
          python - <<'PY'
          import src.app_service
          import src.data_sources
          import src.reporting
          import src.visualizations
          import src.streamlit_ui
          print("Import smoke test passed")
          PY
